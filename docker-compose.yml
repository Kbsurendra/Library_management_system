services:

  mysql:
    image: mysql:8.0
    container_name: library-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: Library_Management
      MYSQL_USER: libraryuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - library-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    container_name: library-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - library-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  springboot:
    image: surendra187/library-management:${IMAGE_TAG:-latest}
    container_name: library-app
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/LibraryManagement
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/Library_Management
      SPRING_DATASOURCE_USERNAME: libraryuser
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SERVER_PORT: 8081
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - library-network

volumes:
  mysql_data:
  mongodb_data:

networks:
  library-network:
    driver: bridge
