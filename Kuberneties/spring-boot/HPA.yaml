kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
metadata:
  name: spring-boot-hpa
  namespace: spring-boot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spring-boot-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
